name: CI

on:
  push:
  pull_request:

jobs:
  # Every build routes through libsoxr (the only SRC backend), so every platform
  # installs the C library + pkg-config before building. Windows uses the
  # vcpkg that ships preinstalled on the GitHub runner, plus pkg-config from choco.
  # Upstream soxr only generates soxr.pc on non-Windows (src/CMakeLists.txt gates
  # it behind NOT WIN32), and libsoxr-sys probes exclusively via pkg-config with
  # no fallback — so the Windows step writes the missing soxr.pc by hand and puts
  # the soxr DLL on PATH so the test binaries can load it at runtime.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libsoxr (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev pkg-config

      - name: Install libsoxr (macOS)
        if: runner.os == 'macOS'
        run: brew install libsoxr pkg-config

      - name: Install libsoxr (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install soxr:x64-windows
          choco install pkgconfiglite -y
          # vcpkg installs headers + soxr.lib but no soxr.pc (upstream skips it on
          # WIN32, and vcpkg_fixup_pkgconfig only rewrites .pc files that exist),
          # so we generate one; forward slashes keep pkg-config happy. The Version
          # is informational only — the probe has no minimum-version requirement.
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\', '/'
          $pcDir = "$prefix/lib/pkgconfig"
          New-Item -ItemType Directory -Force $pcDir | Out-Null
          @"
          prefix=$prefix
          includedir=$prefix/include
          libdir=$prefix/lib

          Name: soxr
          Description: High quality, one-dimensional sample-rate conversion library
          Version: 0.1.3
          Libs: -L$prefix/lib -lsoxr
          Cflags: -I$prefix/include
          "@ | Out-File "$pcDir/soxr.pc" -Encoding ascii
          "PKG_CONFIG_PATH=$pcDir" | Out-File $env:GITHUB_ENV -Append
          # The DLL on PATH lets test binaries load soxr at runtime.
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # The MP3 encoder is never built by the release workflow — deliberately, because
  # mp3lame-sys/mp3lame-encoder are LGPL-3.0 and mint does not distribute them. The cost
  # of that is a feature nothing compiles, which rots. So it is compiled and tested here:
  # building is not distributing, and this is the only place the `--features mp3` path is
  # exercised at all.
  #
  # Unix only. mp3lame-sys drives an autotools build under `#[cfg(unix)]` and a different
  # path on Windows; the release matrix does not need it on any platform, so the two
  # runners that are cheap to keep green are the two it runs on.
  mp3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libsoxr (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsoxr-dev pkg-config

      - name: Install libsoxr (macOS)
        if: runner.os == 'macOS'
        run: brew install libsoxr pkg-config

      - name: Build and test with MP3
        run: cargo test --features mp3 --verbose

      # The other half of the pair: a build that *does* link LAME must say so. If this ever
      # prints "unavailable" the feature has silently stopped being wired up, and the
      # release guard that asserts the opposite would then be proving nothing.
      - name: The binary reports MP3 as available
        run: |
          cargo run --features mp3 -- --version | grep -q 'MP3 encoding: available'

  # Licence policy, and the guard that actually has teeth: `about.toml`'s `accepted` list
  # is an allow-list, so cargo-about fails when a dependency arrives under a licence nobody
  # decided to ship. It is also how `--features mp3` is kept out of releases — LGPL-3.0 is
  # not on the list, so generating with the feature on is an error rather than a surprise.
  #
  # The regenerate-and-diff is the second half: adding a dependency without refreshing
  # THIRD-PARTY-LICENSES.md would ship an archive whose notices are missing a crate.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Licence policy — every dependency is on the accepted list
        run: cargo about generate about.hbs -o /dev/null

      - name: The MP3 feature is refused by the policy
        run: |
          if cargo about generate --features mp3 about.hbs -o /dev/null 2>/dev/null; then
            echo "::error::about.toml accepted LGPL-3.0. The MP3 guard is not guarding."
            exit 1
          fi

      - name: THIRD-PARTY-LICENSES.md is up to date
        run: |
          cargo about generate about.hbs -o /tmp/regenerated.md
          if ! diff -u THIRD-PARTY-LICENSES.md /tmp/regenerated.md; then
            echo "::error::THIRD-PARTY-LICENSES.md is stale. Regenerate it with:"
            echo "::error::  cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md"
            exit 1
          fi
