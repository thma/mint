[package]
name = "mint"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The root stays a real package rather than becoming a virtual manifest: release.yml
# reads the version with `grep -m1 '^version' Cargo.toml`, and `cargo build` here must
# keep meaning "build the CLI" so the GUI's eframe/wgpu tree never enters its graph.
[workspace]
members = ["gui"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
ebur128 = "0.1"
glob = "0.3"
hound = "3.5"
log = "0.4"
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pure-Rust FLAC encoder (no system dependency). Default features off: we batch targets
# under our own rayon pool, so flacenc's `par` would nest/oversubscribe threads (and it
# logs run stats); single-threaded per-file encode is the right fit here.
flacenc = { version = "0.5", default-features = false }
# MP3 encoding. Optional + feature-gated because it links/builds libmp3lame.
mp3lame-encoder = { version = "0.2", optional = true }
symphonia = { version = "0.5.5", features = ["wav", "aiff", "pcm"] }
thiserror = "2.0"
toml = "0.8"
# Pure-Rust FFT for Phase 4.1 psychoacoustic analysis (runtime) and Phase 3 NTF
# validation tests (dev). Single crate covers both roles.
rustfft = "6.2"

# libsoxr is bound by hand in `src/ops/soxr.rs` rather than through the `libsoxr` /
# `libsoxr-sys` crates: those are LGPL-2.0 *Rust* code, statically linked into every binary,
# and unmaintained since 2023. `build.rs` does the pkg-config probe they used to do. The C
# library itself is still required at build and run time and is linked dynamically.
[build-dependencies]
pkg-config = "0.3"

[features]
# MP3 output. Opt-in because mp3lame-sys compiles libmp3lame from vendored C source
# (a build-time `cc`/`make` cost; no system library needed at runtime).
mp3 = ["dep:mp3lame-encoder"]

[dev-dependencies]
approx = "0.5"
rustfft = "6.2"
# Foreign DSF parser, used only as a test oracle in tests/dsd_format.rs: a second opinion
# on the container we write, from code that has never seen our writer. It validates the
# magic/version/block-size fields but not the length fields, so the test asserts those
# itself — that is where an off-by-12 would hide.
dsf = "0.2.2"
