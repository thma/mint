# Render one high-resolution master into several distribution targets.
#
# Each [target.NAME] describes a *deliverable* — the required DSP steps
# (loudness, resample, limit, dither/quantize) are derived automatically from
# the source file and the target spec. Field precedence, lowest to highest:
#   built-in defaults  <  [defaults]  <  preset  <  explicit field
# All available settings are documented in README.md

[meta]
name = "mint-masters"

# Inherited by every target; any field is overridable per-target.
[defaults]
dir     = "./out"
quality = "vhq"            # lq | mq | hq | vhq
# overwrite = false        # the default: refuse to replace anything already at an
#                          # output path, previous renders included. Set it (or pass
#                          # --force) when you want to re-render over them.
# naming defaults to "{target}/{stem}.{cext}"
# placeholders: {stem} {ext} {target} {rate} {format} {cext} {dsd}
#   {cext} is the codec's extension (wav/flac/mp3/dsf); {dsd} is "dsd64"... and
#   empty for PCM targets. On a DSD target {rate} is the 1-bit rate and {format}
#   renders "1bit".

# Streaming master from the Apple Music preset (44.1k / s16 / -16 LUFS / -1 dBTP).
[target.streaming]
preset = "apple-music"

# CD master: the `cd` preset fixes 44.1k / s16 / -0.1 dBTP but leaves loudness to
# you (CD has no loudness standard).
[target.cd]
preset = "cd"
lufs   = -12.0
dither = "shaped"          # TPDF + noise shaping; engages only for s16 targets

[target.cd-adaptive]
preset = "cd"
lufs   = -12.0
dither = "adaptive"        # adaptive psychoacoustic masking mode (s16 only)

# Optional undithered 24-bit delivery: `dither = "none"` is allowed.
# Many engineers consider 24-bit quantization error low enough for this use-case.
[target.archive-s24-none]
format = "s24"
lufs   = -14.0
dither = "none"

# Undithered 16-bit is also allowed, but mint emits a warning because correlated
# quantization distortion is more likely to be audible at s16.
[target.cd-none]
preset = "cd"
lufs   = -12.0
dither = "none"

# 48 kHz delivery via the built-in preset (48k / s24 / -23 LUFS / -1 dBTP).
[target.broadcast]
preset = "broadcast-ebu-r128"   # 48k / s24 / -23 LUFS
bwf    = true

# High-resolution: (96k	/ s24 / -16 LUFS / -0.1 dBTP)
[target.hires]
preset = "hires"

# FLAC (lossless @ 96k / s24  / -16 LUFS / -0.1 dBTP)
[target.flac]
preset = "hires"             # s24 / 96k — also the highest rate FLAC can take here:
                             # mint's encoder stops at 96 kHz, so a 176.4/192 kHz
                             # deliverable has to be codec = "wav".
codec  = "flac"              # -> song.flac (FLAC keeps the s24 depth)

# MP3 (lossy) — codec is independent of bit depth.
[target.mp3]
codec       = "mp3"          # lossy: bit depth/dither not applicable
mp3_bitrate = 320            # default 320; needs `--features mp3`
lufs        = -14.0

# DSD / SACD (1-bit). The `sacd` preset is dsd64 + DSF + -1 dBTP and nothing else:
# `rate` is deliberately unset so the intermediate PCM rate is derived from the source
# (a 96 kHz master goes 96k -> 88.2k, then x32), and `format` must not be set — the sigma-delta
# modulator is the quantizer, so there is no bit depth to pick. Add `lufs` if you want
# loudness normalization; like `cd`, DSD has no loudness standard.
# Files are large: five stereo minutes is ~212 MB at dsd64 and ~1.7 GB at dsd512.
# `--dry-run` prints the exact size before you commit to it.
[target.sacd]
preset = "sacd"            # -> dsd64 / DSF / -1.0 dBTP
# dsd  = "dsd128"          # dsd64 | dsd128 | dsd256 | dsd512

# Limiter character controls (used when on_clip = "limit").
[target.punchy]
preset                = "spotify"
limiter_character     = "transient"   # faster adaptive release
limiter_soft_clip     = true
limiter_link_channels = false          # independent L/R envelopes