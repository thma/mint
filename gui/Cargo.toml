[package]
name = "mint-gui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# One-way dependency: mint knows nothing about mint-gui, so eframe and wgpu never enter
# the CLI binary's graph. Deliberately no `features = ["mp3"]` here — `cargo build
# --workspace` unions features even under resolver 3, so asking for it would pull
# LGPL-3.0 libmp3lame into the CLI build as well. `mint::MP3_AVAILABLE` reports the
# truth instead; the GUI greys the codec out.
mint = { path = ".." }
anyhow = "1.0"

# `wgpu` is on by default; `glow` is added so *both* backends are compiled in and the
# renderer can be chosen at startup (spike gate S7). A black window on a machine without
# working GPU acceleration is not an acceptable failure mode, and the fallback has to be
# already in the binary to be a fallback at all.
eframe = { version = "0.36.1", features = ["glow"] }
# Direct dependency as well as an eframe re-export, so the modules can `use egui::…`.
# Must stay pinned to eframe's own version or two incompatible egui types meet at the
# `App` trait — which is a genuinely baffling error message when it happens.
egui = "0.36.1"
egui_extras = "0.36.1"
# Virtualized table for the plan matrix (S4). Separate crate from egui_extras' Table:
# this one is the one that scrolls a few thousand rows.
egui_table = "0.10"
# Surgical TOML editing (S6). Pinned to 0.22 on purpose: it is already in Cargo.lock
# transitively via toml 0.8, so this costs zero new crates and dedupes. 0.25 would
# duplicate the tree unless mint bumps to toml 1.x, which is a real bump (integer
# handling changed in 0.9), not a patch.
toml_edit = "0.22"
# Read-only, and only for run history: a persisted run file's header (`schema_version`,
# task and failure counts) is pulled back out as a `serde_json::Value` so the list can say
# what a file is without owning a second DTO for the `--json` schema. The GUI never
# *writes* JSON — `json_report::render` does, byte for byte. Already in Cargo.lock via
# mint, so zero new crates.
serde_json = "1.0"
# Local civil time for run-history filenames and labels. Already in Cargo.lock via
# env_logger → mint, so zero new crates — and hand-rolling civil-from-days plus a timezone
# lookup would be exactly the "second implementation" this codebase refuses everywhere
# else.
jiff = "0.2"
# Native file dialogs — the one genuinely new dependency family. The proposal's own
# `gui/Cargo.toml` sketch (§5.1) names it and its capability checklist scores native file
# pickers M: a Sources pane reachable only by drag-and-drop fails that, and so does an
# Export JSON button with nowhere to put the file. Pinned to the current release rather
# than the proposal's 0.15 — the API this uses (`FileDialog::pick_files`/`save_file`) is
# unchanged, and 0.15 is two breaking releases behind. Default features are the Linux
# portal/Wayland backends; harmless here (macOS goes through AppKit) and left on so the
# crate still builds if this is ever opened on a Linux box.
rfd = "0.17"
# The batch runner's fan-out, so it is `cli.rs`'s fan-out and not a second one. Same
# version mint asks for and already in Cargo.lock, so zero new crates. What is wanted is
# `ThreadPoolBuilder` — a **private** pool, never the global one, whose whole job is the
# bound on how many whole-file f64 renders are resident at once.
rayon = "1.10"
# File-watch on the config (proposal §5.2, and named in its own `gui/Cargo.toml` sketch).
# `mint.toml` is the project file and mixed CLI/GUI is the expected mode, so an external edit
# is the normal case rather than an incident — and a workbench that only notices on restart is
# showing a plan for a document that no longer exists. Polling an mtime would carry no crate
# but would need a timer waking a deliberately on-demand renderer several times a second
# forever; on macOS this is the FSEvents binding and costs nothing while nothing happens.
notify = "8.0"

[dev-dependencies]
# Headless egui harness: runs frames without a window, so the form's behaviour is testable
# in CI and on a machine with no display.
egui_kittest = "0.36.1"
